<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLINGRINGSALOTTO</title>
<style>
  :root { --bg: #1a1a1a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  .book { flex: none; }

  /* loader */
  #loader {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center;
    color: #bbb; font: 14px/1.4 system-ui, sans-serif; text-align: center; padding: 24px;
  }
  .spin {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #444; border-top-color: #ddd;
    animation: s 0.9s linear infinite;
  }
  @keyframes s { to { transform: rotate(360deg); } }

  /* gira lo schermo */
  #rotate {
    position: fixed; inset: 0; z-index: 10;
    display: none; flex-direction: column; gap: 22px;
    align-items: center; justify-content: center;
    background: var(--bg); color: #eee;
    font: 600 18px/1.3 system-ui, sans-serif; letter-spacing: .02em;
  }
  #rotate svg { width: 72px; height: 72px; animation: r 2.2s ease-in-out infinite; }
  @keyframes r { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate { display: flex; }
    #stage, #loader { visibility: hidden; }
  }
</style>
</head>
<body>

<div id="stage"></div>

<div id="loader"><div class="spin"></div><div id="progress"></div></div>

<div id="rotate">
  <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round">
    <rect x="20" y="6" width="24" height="52" rx="4"/>
    <line x1="29" y1="51" x2="35" y2="51" stroke-linecap="round"/>
  </svg>
  <div>Gira lo schermo</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
(() => {
  const PDF_URL = 'BLINGRINGSALOTTO.pdf';

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const stage = document.getElementById('stage');
  const loader = document.getElementById('loader');
  const progress = document.getElementById('progress');

  let pageAspect = 297 / 210;   // proporzione di UNA pagina (letta poi dal PDF)
  let urls = [];
  let pageFlip = null;
  let currentIndex = 0;

  // dimensione di una singola pagina in px, così che la doppia pagina riempia lo schermo
  function pageSize() {
    const vw = window.innerWidth * 0.94, vh = window.innerHeight * 0.94;
    let h = vh, w = h * pageAspect;
    if (w * 2 > vw) { w = vw / 2; h = w / pageAspect; }
    return { w: Math.floor(w), h: Math.floor(h) };
  }

  // crea (o ricrea) il libro con dimensioni fisse: le proporzioni restano esatte
  function build() {
    if (!urls.length) return;
    if (pageFlip) {
      currentIndex = pageFlip.getCurrentPageIndex();
      try { pageFlip.destroy(); } catch (e) {}
      stage.innerHTML = '';
    }
    const { w, h } = pageSize();
    const el = document.createElement('div');
    el.className = 'book';
    el.style.width = (w * 2) + 'px';
    el.style.height = h + 'px';
    stage.appendChild(el);

    pageFlip = new St.PageFlip(el, {
      width: w,
      height: h,
      size: 'fixed',
      autoSize: false,
      usePortrait: false,     // sempre doppia pagina
      showCover: false,       // la prima pagina del PDF è già una doppia
      startPage: currentIndex,
      drawShadow: true,
      maxShadowOpacity: 0.55,
      flippingTime: 1000,
      showPageCorners: true,
      mobileScrollSupport: false,
      swipeDistance: 30
    });
    pageFlip.loadFromImages(urls);
  }

  let t;
  const rebuildSoon = () => { clearTimeout(t); t = setTimeout(build, 200); };
  window.addEventListener('resize', rebuildSoon);
  window.addEventListener('orientationchange', rebuildSoon);

  window.addEventListener('keydown', e => {
    if (!pageFlip) return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); pageFlip.flipNext(); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); pageFlip.flipPrev(); }
  });

  const toBlobURL = c => new Promise(res =>
    c.toBlob(b => res(URL.createObjectURL(b)), 'image/jpeg', 0.9));

  (async () => {
    try {
      const pdf = await pdfjsLib.getDocument(PDF_URL).promise;
      const n = pdf.numPages;

      const p1 = await pdf.getPage(1);
      const vp1 = p1.getViewport({ scale: 1 });
      pageAspect = (vp1.width / 2) / vp1.height;

      // risoluzione di rendering adatta allo schermo
      const dpr = window.devicePixelRatio || 1;
      const target = Math.min(2600, Math.max(screen.width, screen.height) * dpr);
      const scale = target / vp1.width;

      const full = document.createElement('canvas');
      const half = document.createElement('canvas');

      for (let i = 1; i <= n; i++) {
        progress.textContent = Math.round(((i - 1) / n) * 100) + '%';
        const page = await pdf.getPage(i);
        const vp = page.getViewport({ scale });
        full.width = Math.floor(vp.width);
        full.height = Math.floor(vp.height);
        const ctx = full.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, full.width, full.height);
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        page.cleanup();

        const hw = Math.floor(full.width / 2), h = full.height;
        half.width = hw; half.height = h;
        const hctx = half.getContext('2d');
        hctx.drawImage(full, 0, 0, hw, h, 0, 0, hw, h);
        urls.push(await toBlobURL(half));
        hctx.drawImage(full, hw, 0, hw, h, 0, 0, hw, h);
        urls.push(await toBlobURL(half));
      }
      full.width = full.height = half.width = half.height = 0;

      loader.style.display = 'none';
      build();
    } catch (err) {
      console.error(err);
      loader.innerHTML = 'Impossibile caricare il PDF.';
    }
  })();
})();
</script>
</body>
</html>
