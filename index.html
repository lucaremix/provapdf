<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLINGRINGSALOTTO</title>
<style>
  :root { --bg: #1a1a1a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
    cursor: pointer;
  }
  #book {
    position: relative;
    width: var(--w, 80vw);
    height: var(--h, 40vw);
    perspective: var(--p, 3000px);
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
    background: #fff;
    visibility: hidden;
  }
  #book.ready { visibility: visible; }
  /* piega centrale */
  #book::after {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to right,
      rgba(0,0,0,0) 46%, rgba(0,0,0,.10) 49.5%, rgba(0,0,0,.18) 50%,
      rgba(0,0,0,.10) 50.5%, rgba(0,0,0,0) 54%);
  }
  .half {
    position: absolute; top: 0; width: 50%; height: 100%;
    display: block; background: #fff;
  }
  #left  { left: 0; }
  #right { left: 50%; }
  #leaf {
    position: absolute; top: 0; left: 50%; width: 50%; height: 100%;
    transform-origin: left center;
    transform-style: preserve-3d;
    z-index: 2;
    display: none;
  }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: #fff;
  }
  .face canvas { width: 100%; height: 100%; display: block; }
  .back { transform: rotateY(180deg); }
  .shade {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
  }
  .front .shade { background: linear-gradient(to left, rgba(0,0,0,.35), rgba(0,0,0,.05)); }
  .back  .shade { background: linear-gradient(to right, rgba(0,0,0,.35), rgba(0,0,0,.05)); }

  /* loader */
  #loader {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #bbb; font: 15px/1.4 system-ui, sans-serif; text-align: center; padding: 24px;
  }
  .spin {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #444; border-top-color: #ddd;
    animation: s 0.9s linear infinite;
  }
  @keyframes s { to { transform: rotate(360deg); } }

  /* gira lo schermo */
  #rotate {
    position: fixed; inset: 0; z-index: 10;
    display: none; flex-direction: column; gap: 22px;
    align-items: center; justify-content: center;
    background: var(--bg); color: #eee;
    font: 600 18px/1.3 system-ui, sans-serif; letter-spacing: .02em;
  }
  #rotate svg { width: 72px; height: 72px; animation: r 2.2s ease-in-out infinite; }
  @keyframes r { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate { display: flex; }
    #stage, #loader { visibility: hidden; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="book">
    <canvas id="left" class="half"></canvas>
    <canvas id="right" class="half"></canvas>
    <div id="leaf">
      <div class="face front"><canvas id="leafFront"></canvas><div class="shade"></div></div>
      <div class="face back"><canvas id="leafBack"></canvas><div class="shade"></div></div>
    </div>
  </div>
</div>

<div id="loader"><div class="spin"></div></div>

<div id="rotate">
  <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round">
    <rect x="20" y="6" width="24" height="52" rx="4"/>
    <line x1="29" y1="51" x2="35" y2="51" stroke-linecap="round"/>
  </svg>
  <div>Gira lo schermo</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(() => {
  const PDF_URL = 'BLINGRINGSALOTTO.pdf';
  const DURATION = 900;
  const EASING = 'cubic-bezier(.45,.05,.35,1)';

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const $ = id => document.getElementById(id);
  const book = $('book'), leaf = $('leaf'), loader = $('loader');
  const cLeft = $('left'), cRight = $('right'), cFront = $('leafFront'), cBack = $('leafBack');
  const shadeFront = leaf.querySelector('.front .shade');
  const shadeBack  = leaf.querySelector('.back .shade');

  let pdf, numPages, aspect = 2 * 210 / 297, renderScale = 1;
  let cur = 1, busy = false;
  const cache = new Map();

  // ---------- layout ----------
  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const m = 0.94;
    let w = vw * m, h = w / aspect;
    if (h > vh * m) { h = vh * m; w = h * aspect; }
    book.style.setProperty('--w', w + 'px');
    book.style.setProperty('--h', h + 'px');
    book.style.setProperty('--p', (w * 2) + 'px');
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 200));

  // ---------- rendering ----------
  function makeCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }

  function getSpread(n) {
    if (cache.has(n)) return cache.get(n);
    const p = (async () => {
      const page = await pdf.getPage(n);
      const vp = page.getViewport({ scale: renderScale });
      const full = makeCanvas(Math.floor(vp.width), Math.floor(vp.height));
      const ctx = full.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, full.width, full.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;

      const hw = Math.floor(full.width / 2), h = full.height;
      const L = makeCanvas(hw, h);
      L.getContext('2d').drawImage(full, 0, 0, hw, h, 0, 0, hw, h);
      const R = makeCanvas(full.width - hw, h);
      R.getContext('2d').drawImage(full, hw, 0, full.width - hw, h, 0, 0, full.width - hw, h);
      full.width = full.height = 0;
      page.cleanup();
      return { L, R };
    })();
    cache.set(n, p);
    p.catch(() => cache.delete(n));
    return p;
  }

  function paint(target, src) {
    if (target.width !== src.width || target.height !== src.height) {
      target.width = src.width; target.height = src.height;
    }
    target.getContext('2d').drawImage(src, 0, 0);
  }

  function evictAndPrefetch() {
    for (const [k, p] of cache) {
      if (Math.abs(k - cur) > 3) {
        cache.delete(k);
        p.then(s => { s.L.width = s.L.height = s.R.width = s.R.height = 0; }).catch(() => {});
      }
    }
    [cur + 1, cur - 1, cur + 2].forEach(n => { if (n >= 1 && n <= numPages) getSpread(n); });
  }

  // ---------- flip ----------
  function flip(reverse) {
    const opts = { duration: DURATION, easing: EASING, direction: reverse ? 'reverse' : 'normal', fill: 'forwards' };
    const a = leaf.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(-180deg)' }], opts);
    const b = shadeFront.animate([{ opacity: 0 }, { opacity: 1, offset: 0.5 }, { opacity: 1 }], opts);
    const c = shadeBack.animate([{ opacity: 1 }, { opacity: 1, offset: 0.5 }, { opacity: 0 }], opts);
    return Promise.all([a.finished, b.finished, c.finished]).then(() => [a, b, c]);
  }

  function endFlip(anims) {
    leaf.style.display = 'none';
    anims.forEach(a => a.cancel());
  }

  async function next() {
    if (busy || cur >= numPages) return;
    busy = true;
    try {
      const [a, b] = await Promise.all([getSpread(cur), getSpread(cur + 1)]);
      paint(cFront, a.R);
      paint(cBack, b.L);
      leaf.style.transform = 'rotateY(0deg)';
      leaf.style.display = 'block';
      paint(cRight, b.R);
      const anims = await flip(false);
      paint(cLeft, b.L);
      endFlip(anims);
      cur++;
      evictAndPrefetch();
    } finally { busy = false; }
  }

  async function prev() {
    if (busy || cur <= 1) return;
    busy = true;
    try {
      const [a, b] = await Promise.all([getSpread(cur - 1), getSpread(cur)]);
      paint(cFront, a.R);
      paint(cBack, b.L);
      leaf.style.transform = 'rotateY(-180deg)';
      leaf.style.display = 'block';
      paint(cLeft, a.L);
      const anims = await flip(true);
      paint(cRight, a.R);
      endFlip(anims);
      cur--;
      evictAndPrefetch();
    } finally { busy = false; }
  }

  // ---------- input: tap a destra/sinistra, swipe, frecce ----------
  let x0 = null, y0 = null;
  const stage = $('stage');
  stage.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; });
  stage.addEventListener('pointerup', e => {
    if (x0 === null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    x0 = y0 = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      dx < 0 ? next() : prev();
    } else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
      e.clientX > window.innerWidth / 2 ? next() : prev();
    }
  });
  stage.addEventListener('pointercancel', () => { x0 = y0 = null; });
  window.addEventListener('keydown', e => {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); next(); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
  });

  // ---------- avvio ----------
  (async () => {
    try {
      pdf = await pdfjsLib.getDocument(PDF_URL).promise;
      numPages = pdf.numPages;
      const p1 = await pdf.getPage(1);
      const vp = p1.getViewport({ scale: 1 });
      aspect = vp.width / vp.height;
      const dpr = window.devicePixelRatio || 1;
      const target = Math.min(2400, Math.max(screen.width, screen.height) * dpr);
      renderScale = target / vp.width;
      layout();
      const s = await getSpread(1);
      paint(cLeft, s.L);
      paint(cRight, s.R);
      book.classList.add('ready');
      loader.style.display = 'none';
      evictAndPrefetch();
    } catch (err) {
      console.error(err);
      loader.textContent = 'Impossibile caricare il PDF.';
    }
  })();
})();
</script>
</body>
</html>
